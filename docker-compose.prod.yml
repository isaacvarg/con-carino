# Production deployment.
#
# Deploy (CLI or Arcane redeploy — both are just pull + up):
#   docker network create edge                                    # once
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Migrations run automatically: `app` waits on the one-shot `migrate` service
# completing successfully before starting.

services:
  app:
    image: ghcr.io/isaacvarg/con-carino:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: con-carino-app
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      DATABASE_URL: postgresql://${POSTGRES_USER:-con_carino}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-con_carino}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      # Must include the auth base path (start-authjs derives basePath from
      # AUTH_URL's pathname), e.g. https://enos.thevargas.casa/api/auth
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: 'true'
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET}
      AUTH_RESEND_KEY: ${AUTH_RESEND_KEY}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM}
      JOB_SECRET: ${JOB_SECRET:?JOB_SECRET is required}
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-con-carino}
      S3_FORCE_PATH_STYLE: 'true'
    networks:
      - edge
      - backend
    depends_on:
      rustfs:
        condition: service_started
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:18-alpine
    container_name: con-carino-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-con_carino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-con_carino}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-con_carino} -d ${POSTGRES_DB:-con_carino}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: con-carino-rustfs-prod
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      RUSTFS_ADDRESS: '0.0.0.0:9000'
    volumes:
      - rustfs_data:/data
    command: ['/data']
    networks:
      - backend

  # Drives scheduled work by POSTing /api/jobs on a loop. The app claims each
  # job's time bucket in the job_runs table, so a duplicate or late tick is a
  # no-op rather than a double run — this loop only has to be roughly on time.
  #
  # A stock curl image with a sleep loop rather than a crond image, so this
  # needs no Dockerfile stage, no CI build, and no third GHCR package. The
  # -m 300 timeout means the effective interval can stretch to ~6 minutes,
  # which is irrelevant for jobs whose finest granularity is "shifts that
  # already ended".
  #
  # $$JOB_SECRET is doubled so Compose passes the literal through to the shell
  # instead of interpolating it at parse time.
  cron:
    image: curlimages/curl:8.11.1
    container_name: con-carino-cron
    restart: unless-stopped
    environment:
      JOB_SECRET: ${JOB_SECRET:?JOB_SECRET is required}
    networks:
      - backend
    depends_on:
      app:
        condition: service_started
    entrypoint: ['/bin/sh', '-c']
    # Kept on one line on purpose: a YAML folded block (>) preserves newlines
    # around more-indented lines, which would split the curl invocation across
    # lines and silently run it without a URL.
    command:
      - 'while :; do curl -fsS -m 300 -X POST -H "Authorization: Bearer $$JOB_SECRET" http://app:3000/api/jobs || echo "[cron] job tick failed"; sleep 60; done'

  # One-shot: runs `prisma migrate deploy` on every stack up (idempotent —
  # exits immediately when no migrations are pending). The app waits for it
  # to succeed, so a plain redeploy from Arcane always migrates first.
  migrate:
    image: ghcr.io/isaacvarg/con-carino-migrate:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-con_carino}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-con_carino}?schema=public
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

networks:
  edge:
    external: true
  backend:
    internal: true

volumes:
  rustfs_data:
  postgres_data:
